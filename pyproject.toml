[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partchangelog"
description = "Logs events for parts, categories, and parameters."
dynamic = ["version"]
authors = [
    { name = "Craig Burden", email = "craig@plentify.co.za" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin", "changelog", "parts"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.urls]
Homepage = "https://github.com/CraigBurden/inventree_part_changelog"

[project.entry-points."inventree_plugins"]
PartChangeLog = "partchangelog.core:PartChangeLogPlugin"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = {attr = "partchangelog.PLUGIN_VERSION"}
